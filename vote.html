<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Голосование — Мастерская новых медиа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  :root{
    --bg-deep:#04100f; --bg-glow:#2c6669;
    --blue-1:#164e4d; --blue-2:#0a2b2b;
    --gold-1:#b8f0f1; --gold-2:#63c3c5; --gold-3:#2f8f92;
    --white:#eaf6f6;
  }
  html,body{height:100%}
  body{
    font-family:'Montserrat',sans-serif; color:var(--white);
    background:radial-gradient(120% 90% at 50% 8%, var(--bg-glow) 0%, #123a39 34%, var(--bg-deep) 78%);
    min-height:100%; display:flex; flex-direction:column; align-items:center;
    padding:34px 20px calc(34px + env(safe-area-inset-bottom));
  }
  .mark{ width:64px; margin-bottom:10px; filter:drop-shadow(0 0 16px rgba(99,195,197,.55)) }
  .mark rect{ width:12px; height:12px; fill:#fff }
  .kicker{
    font-family:'Oswald',sans-serif; letter-spacing:.32em; font-size:12px;
    text-transform:uppercase; color:var(--gold-2); padding-left:.32em; margin-bottom:26px;
  }
  .status{
    font-family:'Oswald',sans-serif; font-weight:500; text-align:center;
    font-size:clamp(17px,5vw,22px); color:var(--gold-1); margin-bottom:24px; min-height:26px;
  }
  .options{ width:100%; max-width:480px; display:flex; flex-direction:column; gap:13px }
  .opt{
    display:flex; align-items:center; gap:14px; cursor:pointer; padding:2px;
    background:linear-gradient(180deg,var(--gold-1),var(--gold-3));
    clip-path:polygon(3.5% 0, 96.5% 0, 100% 50%, 96.5% 100%, 3.5% 100%, 0 50%);
    transition:transform .12s;
  }
  .opt-inner{
    display:flex; align-items:center; gap:12px; width:100%;
    padding:16px 22px; min-height:58px;
    background:linear-gradient(180deg,var(--blue-1),var(--blue-2));
    clip-path:polygon(3.5% 0, 96.5% 0, 100% 50%, 96.5% 100%, 3.5% 100%, 0 50%);
  }
  .opt:active{ transform:scale(.985) }
  .opt .letter{ font-family:'Oswald',sans-serif; font-weight:700; color:var(--gold-1); font-size:20px; min-width:20px }
  .opt .text{ font-size:clamp(14px,4vw,17px); font-weight:500; line-height:1.25 }
  .opt.picked{ background:linear-gradient(180deg,#b8f0f1,#3fb3b6) }
  .opt.picked .opt-inner{ background:linear-gradient(180deg,#ffcf5c,#e69a15) }
  .opt.picked .letter,.opt.picked .text{ color:#20140a }
  .opt.locked{ pointer-events:none; opacity:.7 }
  .done{ text-align:center; font-size:15px; color:var(--gold-1); line-height:1.5 }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 96 84" xmlns="http://www.w3.org/2000/svg" aria-label="МНМ">
    <rect x="12" y="0"/><rect x="24" y="0"/>
    <rect x="0" y="12"/><rect x="12" y="12"/>
    <rect x="0" y="24"/><rect x="24" y="24"/><rect x="60" y="24"/>
    <rect x="24" y="36"/><rect x="36" y="36"/><rect x="48" y="36"/><rect x="60" y="36"/>
    <rect x="24" y="48"/><rect x="60" y="48"/><rect x="84" y="48"/>
    <rect x="72" y="60"/><rect x="84" y="60"/>
    <rect x="60" y="72"/><rect x="72" y="72"/>
  </svg>
  <div class="kicker">Помощь зала</div>
  <div class="status" id="status">Подключение…</div>
  <div class="options" id="options"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBXWhYUZhqDZy0M8ww-MPl36eYh3sDLXjg",
  authDomain: "mnm-game.firebaseapp.com",
  databaseURL: "https://mnm-game-default-rtdb.firebaseio.com",
  projectId: "mnm-game",
  storageBucket: "mnm-game.firebasestorage.app",
  messagingSenderId: "98112010777",
  appId: "1:98112010777:web:62d51e4cc6724227ec8888"
};

const statusEl = document.getElementById('status');
const optsEl = document.getElementById('options');
let db = null;
try{
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.database();
}catch(e){
  statusEl.textContent = 'Не удалось подключиться к серверу.';
}

if(db){
  db.ref('poll').on('value', snap=>{
    const p = snap.val();
    optsEl.innerHTML = '';
    if(!p || !p.active){ statusEl.textContent = 'Голосование ещё не началось. Ожидайте…'; return; }
    const voted = !!localStorage.getItem('mnm_voted_'+p.round);
    if(voted){ statusEl.textContent = 'Ваш голос учтён ✓'; showDone(); return; }
    statusEl.textContent = 'Выберите вариант ответа';
    const options = Array.isArray(p.options) ? p.options : Object.values(p.options||{});
    options.forEach(o=>{
      const el = document.createElement('div');
      el.className = 'opt';
      el.innerHTML = '<div class="opt-inner"><span class="letter">'+o.letter+'</span><span class="text">'+o.text+'</span></div>';
      el.onclick = ()=> castVote(o.i, p.round);
      optsEl.appendChild(el);
    });
  }, ()=>{ statusEl.textContent = 'Нет доступа к серверу голосования.'; });
}

function castVote(i, round){
  const key = 'mnm_voted_'+round;
  if(localStorage.getItem(key)) return;
  localStorage.setItem(key,'1');
  db.ref('poll/votes/'+i).transaction(v => (v||0)+1);
  statusEl.textContent = 'Спасибо! Ваш голос принят ✓';
  optsEl.querySelectorAll('.opt').forEach(a=>a.classList.add('locked'));
  showDone();
}
function showDone(){
  optsEl.innerHTML = '<div class="done">Можно убрать телефон 🎉<br>Результаты покажут на экране.</div>';
}
</script>
</body>
</html>
